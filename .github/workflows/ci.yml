name: CI backend

on:
  push:
    branches: [main, dev, 'feat/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estruturas-c:
    name: Estruturas da AED em C11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar e rodar os testes C11
        working-directory: academic/c
        run: make testar

  backend:
    name: Build, testes e paridade C11 x Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Instalar compilador C11
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: mvnw verify
        run: ./mvnw -B verify

      - name: Guardar as saidas da paridade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paridade-aed
          path: target/paridade/
          if-no-files-found: warn

      - name: Guardar os relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/cucumber/
          if-no-files-found: warn

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [backend, estruturas-c]
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t bloodell-backend:${{ github.sha }} .

      - name: Testar stack de observabilidade em Linux
        env:
          BLOODELL_IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          export GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          trap 'docker compose down -v' EXIT
          docker compose config --quiet
          docker compose up -d --no-build --wait --wait-timeout 240
          if ! python3 scripts/verificar-observabilidade.py; then
            docker compose logs --tail=50 cadvisor alloy tempo carga
            docker compose exec -T api ls -l /app/logs
            exit 1
          fi
          for uid in bloodell-aplicacao bloodell-infraestrutura; do
            echo "Dashboard: $uid"
            curl --retry 8 --retry-all-errors --retry-delay 3 -fsS -u "admin:$GRAFANA_ADMIN_PASSWORD" "http://localhost:3000/api/dashboards/uid/$uid" >/dev/null || { docker compose logs --tail=100 grafana; exit 1; }
          done
          for uid in prometheus loki tempo; do
            echo "Datasource: $uid"
            curl -fsS -u "admin:$GRAFANA_ADMIN_PASSWORD" "http://localhost:3000/api/datasources/uid/$uid" | jq -e --arg uid "$uid" '.uid == $uid'
          done
          GRAFANA_VIEWER_SENHA="$(openssl rand -hex 16)" python3 scripts/criar-viewer.py
          python3 -m venv "$RUNNER_TEMP/relatorio"
          "$RUNNER_TEMP/relatorio/bin/pip" install playwright reportlab
          "$RUNNER_TEMP/relatorio/bin/python" scripts/capturar-observabilidade.py
          "$RUNNER_TEMP/relatorio/bin/python" scripts/relatorio.py

      - name: Guardar relatório e capturas datadas
        uses: actions/upload-artifact@v4
        with:
          name: observabilidade
          path: |
            docs/relatorio.pdf
            docs/evidencias/observabilidade/

      - name: Preparar acesso a EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY" && test -n "$EC2_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/bloodell_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/bloodell_deploy ~/.ssh/known_hosts

      - name: Enviar a imagem testada para a EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          docker save "bloodell-backend:${GITHUB_SHA}" | gzip | ssh -o BatchMode=yes -i ~/.ssh/bloodell_deploy "arthur@${EC2_HOST}" 'gunzip | docker load'

      - name: Publicar e conferir saude
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/bloodell_deploy "arthur@${EC2_HOST}" "bash -se -- '${GITHUB_SHA}'" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          cd ~/bloodell-backend
          test -f .env
          git fetch origin main
          git switch main
          git merge --ff-only origin/main
          test "$(git rev-parse HEAD)" = "$sha"
          export BLOODELL_IMAGE_TAG="$sha"
          export COMPOSE_FILE=compose.yaml:compose.deploy.yaml
          docker compose config --quiet
          docker compose up -d --no-build --wait --wait-timeout 240
          docker compose exec -T api curl -fsS http://localhost:8081/actuator/health
          python3 scripts/verificar-observabilidade.py
          REMOTE
          curl -fsS "https://${EC2_HOST}/grafana/api/health" | jq -e '.database == "ok"'
          curl -fsS "https://${EC2_HOST}/" >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' "https://${EC2_HOST}/api/v1/hemocentros")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' "https://${EC2_HOST}/actuator/health")" = 404
