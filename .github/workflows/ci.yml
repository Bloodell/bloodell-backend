name: CI backend

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estruturas-cpp:
    name: Estruturas da AED em C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar e rodar os testes C++
        working-directory: academic/cpp
        run: make testar

  backend:
    name: Build, testes e paridade C++ x Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Instalar compilador C++
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: mvnw verify
        run: ./mvnw -B verify

      - name: Guardar as saidas da paridade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paridade-aed
          path: target/paridade/
          if-no-files-found: warn

      - name: Guardar os relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [backend, estruturas-cpp]
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t bloodell-backend:${{ github.sha }} .
