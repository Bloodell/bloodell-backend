name: CI backend

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estruturas-c:
    name: Estruturas da AED em C11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar e rodar os testes C11
        working-directory: academic/c
        run: make testar

  backend:
    name: Build, testes e paridade C11 x Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Instalar compilador C11
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: mvnw verify
        run: ./mvnw -B verify

      - name: Guardar as saidas da paridade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paridade-aed
          path: target/paridade/
          if-no-files-found: warn

      - name: Guardar os relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [backend, estruturas-c]
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t bloodell-backend:${{ github.sha }} .

      - name: Preparar acesso a EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY" && test -n "$EC2_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/bloodell_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/bloodell_deploy ~/.ssh/known_hosts

      - name: Enviar a imagem testada para a EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          docker save "bloodell-backend:${GITHUB_SHA}" | gzip | ssh -o BatchMode=yes -i ~/.ssh/bloodell_deploy "arthur@${EC2_HOST}" 'gunzip | docker load'

      - name: Publicar e conferir saude
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/bloodell_deploy "arthur@${EC2_HOST}" "bash -se -- '${GITHUB_SHA}'" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          cd ~/bloodell-backend
          test -f .env
          git fetch origin main
          git switch main
          git merge --ff-only origin/main
          test "$(git rev-parse HEAD)" = "$sha"
          BLOODELL_IMAGE_TAG="$sha" docker compose -f compose.yaml -f compose.deploy.yaml up -d --no-build --wait
          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health
          REMOTE
          curl --fail --silent --show-error "https://${EC2_HOST}/actuator/health"
