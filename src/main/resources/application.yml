spring:
  application:
    name: bloodell-backend
  profiles:
    default: local
  datasource:
    url: ${BLOODELL_DB_URL:jdbc:postgresql://localhost:5432/bloodell}
    username: ${BLOODELL_DB_USER:bloodell}
    password: ${BLOODELL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${BLOODELL_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requisicaoId:-sem-correlacao}] [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requisicaoId:-sem-correlacao}] [%thread] %logger{36} - %msg%n"
  file:
    name: ${BLOODELL_LOG_FILE:logs/bloodell.log}
  level:
    root: INFO
    br.edu.cesar.bloodell: ${BLOODELL_LOG_LEVEL:DEBUG}

bloodell:
  cors:
    origens: ${BLOODELL_CORS_ORIGENS:http://127.0.0.1:5173,http://localhost:5173}
  telemetria:
    capacidade-fila: ${BLOODELL_TELEMETRIA_FILA:10000}
    quantidade-workers: ${BLOODELL_TELEMETRIA_WORKERS:4}
    tamanho-lote: ${BLOODELL_TELEMETRIA_LOTE:100}
  demonstracao:
    habilitado: ${BLOODELL_DEMO_HABILITADO:true}
  seguranca:
    autenticacao-habilitada: ${BLOODELL_AUTH_HABILITADA:false}
