global:
  scrape_interval: 15s
scrape_configs:
  - job_name: bloodell-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
