# Maven Wrapper do projeto BLOODELL.
#
# distributionType=only-script: o mvnw baixa o Maven direto do repositorio
# oficial na primeira execucao. Nao existe um .jar do wrapper versionado aqui,
# o que mantem o repositorio limpo (nenhum binario no Git).
#
# A versao 3.9.16 e a mesma ja instalada nas maquinas da equipe: assim o build
# local e o do CI usam exatamente o mesmo Maven.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
